<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страницы нет — Колёса 03</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/kolesa03-demo/assets/logo.png">
<style>
  :root{--bg:#0b0a09;--fg:#f4f1ec;--muted:#a9a29a;--line:rgba(243,240,234,.12);--brand:#ed1b24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.6 "Golos Text","Segoe UI",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:32px}
  main{max-width:560px}
  .code{font:600 96px/1 "Unbounded","Segoe UI",sans-serif;letter-spacing:-.04em;color:var(--brand);margin:0 0 8px}
  h1{font:600 30px/1.25 "Unbounded","Segoe UI",sans-serif;margin:0 0 14px}
  p{color:var(--muted);margin:0 0 26px}
  a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  a:hover{border-color:var(--brand)}
  a:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Такой страницы нет</h1>
  <p>Шиномонтаж на месте: Улан-Удэ, улица Жердева, 8а. Ежедневно с 9:00 до 20:00.</p>
  <div class="row">
    <a href="/kolesa03-demo/">Вернуться на главную</a>
    <a href="tel:+79021661466">+7 902 166-14-66</a>
  </div>
</main>
</body>
</html>
