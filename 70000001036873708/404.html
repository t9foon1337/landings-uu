<!doctype html>
<html lang="ru">
<head>

<style>
  :root{--paper:#f3efe4;--card:#fffdf7;--ink:#191610;--ink-2:#5b564a;--line:rgba(25,22,16,.20);--line-soft:rgba(25,22,16,.11);--blue:#14419b;--red:#c2262c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.62 "GolosText",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;

  h1{font-family:"Play",sans-serif;font-weight:700;margin:0;line-height:1.08}
  p{margin:0}
  a{color:var(--blue)}
  img{display:block}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;width:100%}
  .top{border-bottom:1px solid var(--line);background:var(--paper)}
  .bar{display:flex;align-items:center;gap:10px;min-height:64px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{width:38px;height:38px}
  .brand b{font-family:"Play",sans-serif;font-weight:700;font-size:21px}
  main{flex:1;display:flex;align-items:center;padding:48px 0 64px}
  .box{max-width:640px}
  .code{font-family:"Play",sans-serif;font-weight:700;font-size:clamp(64px,13vw,120px);line-height:.9;color:var(--red);letter-spacing:-.02em}
  h1{font-size:clamp(24px,3.2vw,35px);margin-top:16px}
  .txt{margin-top:14px;color:var(--ink-2);max-width:46ch}
  .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 22px;border-radius:3px;
       border:1px solid var(--red);background:var(--red);color:#fff;text-decoration:none;font:500 15.5px/1 "GolosText",sans-serif}
  .btn:hover{background:#a51d23;border-color:#a51d23}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{background:var(--card);border-color:var(--ink);color:var(--ink)}
  .tagline{margin-top:34px;font-size:13px;color:#5b564a;max-width:60ch}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" width="38" height="38" alt="Логотип магазина «Автомир»">
      <b>Автомир</b>

<main>

      <h1>Такой страницы нет</h1>

      <div class="acts">
        <a class="btn" href="tel:+73012379483">Позвонить</a>
        <a class="btn btn-ghost" href="index.html">На главную</a>
      </div>
      <p class="tagline">Демонстрационная страница. Данные и фото — из открытой карточки организации в 2ГИС.</p>
    </div>
  </div>
