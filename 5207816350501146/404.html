.btn-primary:hover{background:#e9b800}
.btn-ghost{border-color:var(--hair-dark);font-weight:500}
.btn-ghost:hover{background:rgba(238,241,244,.08);border-color:rgba(238,241,244,.45)}

footer{border-top:1px solid var(--hair-dark);padding:28px 0 40px;font-size:13px;color:#a9b5c4}
