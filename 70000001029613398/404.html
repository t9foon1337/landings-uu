<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Сити, шиномонтаж на Сахьяновой</title>
<meta name="description" content="Такой страницы нет. Вернитесь на главную страницу шиномонтажа «Сити» на Сахьяновой, 5 ст А в Улан-Удэ.">
<meta name="theme-color" content="#edeae2">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/rubik.css">
<style>
:root{--concrete:#edeae2;--ink:#191b1d;--muted:#53585c;--line:#cdc6b7;--signal:#f5c400}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--concrete);color:var(--ink);
  font:400 17px/1.55 Rubik,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
a{color:inherit}
h1{margin:0;font-size:clamp(30px,5.5vw,58px);line-height:1.05;letter-spacing:-.02em;font-weight:700;max-width:20ch}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;width:100%}
.lane{height:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 48px,transparent 48px 86px)}
.hdr{border-bottom:1px solid var(--line);background:var(--concrete)}
.hdr__in{display:flex;align-items:center;gap:12px;min-height:68px}
.mark{width:40px;height:40px;background:var(--signal);border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;fill:var(--ink)}
.brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none}
.brand b{font-size:19px}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
main{flex:1;display:flex;align-items:center;padding:56px 0}
.code{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.code::before{content:"";width:26px;height:3px;background:var(--signal)}
p.lead{margin:24px 0 0;font-size:18px;color:var(--muted);max-width:44ch}
.act{margin-top:32px;display:flex;flex-wrap:wrap;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:13px 26px;
  background:var(--signal);color:var(--ink);border:2px solid var(--ink);border-radius:2px;
  font:700 17px/1 Rubik,sans-serif;text-decoration:none}
.btn:hover{background:var(--ink);color:var(--signal)}
.btn--ghost{background:transparent}
.btn--ghost:hover{background:var(--ink);color:var(--concrete)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ftr{padding:24px 0 32px;font-size:13px;color:var(--muted)}
@media (max-width:720px){.act .btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="lane"></div>
<header class="hdr">
  <div class="wrap hdr__in">
    <a class="brand" href="index.html" aria-label="Сити — на главную">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 9.2h11.4V3.4L22 12l-8.6 8.6v-5.8H2z"/></svg></span>
    </a>
    <span class="brand"><b>Сити</b><span>шиномонтаж · 24</span></span>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="code">Ошибка 404</p>
    <h1>Дорога здесь заканчивается</h1>
    <p class="lead">Такой страницы нет. Шиномонтаж на месте: Сахьяновой, 5 ст А, круглосуточно.</p>
    <div class="act">
      <a class="btn" href="index.html">На главную</a>
      <a class="btn btn--ghost" href="tel:+79644077637">Позвонить</a>
    </div>
  </div>
</main>
<footer class="ftr">
  <div class="wrap">Демонстрационная страница. Данные и фото — из открытой карточки организации в 2ГИС.</div>
</footer>
</body>
</html>
