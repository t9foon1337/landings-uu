<link rel="stylesheet" href="assets/fonts/golos.css">

<style>
:root{
  --paper:#f7f7f4;--ink:#14181c;--muted:#5d6670;--rule:#d6dade;
  --blue:#143c60;--blue-deep:#0d2c47;--orange:#e2680e;--orange-ink:#a04700;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,rgba(20,60,96,.07) 1px,transparent 1px),
    linear-gradient(180deg,rgba(20,60,96,.07) 1px,transparent 1px);
  background-size:34px 34px;
  color:var(--ink);font:400 17px/1.6 "GolosText",-apple-system,"Segoe UI",sans-serif;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;width:100%}
.hdr{border-bottom:1px solid var(--rule);background:rgba(255,255,255,.96)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;min-height:66px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand b{font-size:18px;letter-spacing:-.02em}
.brand small{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.11em;color:var(--muted);text-transform:uppercase}
main{flex:1;display:flex;align-items:center;padding:64px 0}
.code{font-family:"JetBrains Mono",monospace;font-size:clamp(72px,16vw,160px);font-weight:700;line-height:.9;color:var(--blue);letter-spacing:-.04em;margin:0}
.mm{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-ink)}
.mm::before{content:"";width:22px;height:2px;background:var(--orange)}
h1{font-size:clamp(22px,3vw,32px);margin:20px 0 0;letter-spacing:-.02em}
p{color:#3a424a;max-width:52ch;margin:14px 0 0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;margin-top:32px;
  background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:2px;
  font:600 16px/1 "GolosText",sans-serif;text-decoration:none;
}
.btn:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.btn--ghost{background:transparent;color:var(--blue);margin-left:10px}
.btn--ghost:hover{background:#eaf0f5;color:var(--blue-deep)}
footer{border-top:1px solid var(--rule);padding:24px 0;color:var(--muted);font-size:13px;background:rgba(255,255,255,.6)}
@media(max-width:560px){.btn--ghost{margin-left:0}}
</style>
</head>
<body>
<header class="hdr">
  <div class="wrap hdr__in">
    <a class="brand" href="index.html">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="13" y="3" width="6" height="15" fill="none" stroke="#143c60" stroke-width="2"/>
        <rect x="9" y="18" width="14" height="11" fill="none" stroke="#143c60" stroke-width="2"/>
        <rect x="23" y="5" width="7" height="2" fill="#e2680e"/>
        <rect x="23" y="9" width="4" height="2" fill="#e2680e"/>
      </svg>
      <span><b>Shtok Service</b><small>центр прокачки стоек</small></span>
    </a>
    <a class="btn" href="tel:+79240132932" style="min-height:44px;font-size:15px;margin-top:0">Позвонить</a>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="code">404</p>
    <p class="mm">страницы с таким адресом нет</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес набран с ошибкой. Сам бокс на месте: Братская улица, 24Б, ежедневно с 09:00 до 19:00.</p>
    <a class="btn" href="index.html">На главную</a>
    <a class="btn btn--ghost" href="tel:+79240132932">Позвонить</a>
  </div>
</main>

<footer>
  <div class="wrap">Shtok Service · Улан-Удэ, Братская улица, 24Б · +7 (924) 013-29-32</div>
</footer>
</body>
</html>
