<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — «24 сотых»</title>
<meta name="description" content="Такой страницы нет. Шиномонтаж «24 сотых» на Ринчино, 1а/2 в Улан-Удэ работает круглосуточно.">
<meta name="theme-color" content="#0B0B0A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/rubikmono.css">
<link rel="stylesheet" href="assets/fonts/plexsans.css">
<style>
:root{--asphalt:#0B0B0A;--panel:#141412;--chalk:#F5F2E9;--dust:#A6A396;--signal:#FFC300;--line:#2B2A26}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100svh;background:var(--asphalt);color:var(--chalk);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:17px;line-height:1.55;
  display:flex;flex-direction:column;
}
.wrap{max-width:860px;margin:0 auto;padding:0 clamp(16px,4vw,48px);width:100%}
.top{border-bottom:1px solid var(--line)}
.top__in{min-height:72px;display:flex;align-items:center}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.mark__hex{
  width:38px;height:40px;display:grid;place-items:center;flex:none;background:var(--signal);color:var(--asphalt);
  font-family:'Rubik Mono One',monospace;font-size:15px;line-height:1;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.mark__word{font-weight:600;font-size:17px}
main{flex:1;display:flex;align-items:center;padding-block:clamp(32px,7vw,80px)}
.code{
  font-family:'Rubik Mono One',monospace;color:var(--signal);
  font-size:clamp(80px,22vw,190px);line-height:.82;letter-spacing:-.04em;
  display:flex;align-items:flex-end;gap:clamp(12px,2vw,26px);
}
.code span{
  font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:clamp(15px,2vw,22px);
  color:var(--chalk);letter-spacing:.01em;padding-bottom:.6em;line-height:1.15;
}
h1{font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.2;letter-spacing:-.02em;margin:var(--s4,32px) 0 0}
p{margin:12px 0 0;color:var(--dust);max-width:52ch}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 24px;
  font:600 16px/1.2 'IBM Plex Sans',sans-serif;text-decoration:none;border:1px solid var(--signal);
  background:var(--signal);color:var(--asphalt);border-radius:0;
}
.btn:hover{background:#FFD44D;border-color:#FFD44D}
.btn--ghost{background:transparent;border-color:var(--line);color:var(--chalk)}
.btn--ghost:hover{background:transparent;border-color:var(--chalk)}
.btn:focus-visible{outline:2px solid var(--chalk);outline-offset:3px}
.ruler{
  height:26px;margin-top:40px;border-bottom:1px solid var(--line);
  background:
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px) bottom left/auto 10px no-repeat,
    repeating-linear-gradient(90deg,#3B3A34 0 2px,transparent 2px 60px) bottom left/auto 22px no-repeat;
}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:13px;color:var(--dust)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top__in">
    <a class="mark" href="index.html">
      <span class="mark__hex">24</span>
      <span class="mark__word">сотых</span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="code">404<span>страницы<br>нет на шкале</span></p>
    <h1>Такого адреса у нас нет</h1>
    <p>Зато шиномонтаж на месте: Улица Ринчино, 1а/2, Октябрьский район, Улан-Удэ. Работаем круглосуточно.</p>
    <div class="acts">
      <a class="btn" href="index.html">На главную</a>
      <a class="btn btn--ghost" href="tel:+79836318087">+7 (983) 631-80-87</a>
    </div>
    <div class="ruler" aria-hidden="true"></div>
  </div>
</main>

<footer>
  <div class="wrap">«24 сотых», шиномонтаж — Улица Ринчино, 1а/2, Улан-Удэ. Демонстрационная страница.</div>
</footer>
</body>
</html>
