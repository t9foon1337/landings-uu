<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Garage masters</title>
<meta name="description" content="Такой страницы нет. Телефон автосервиса Garage masters: +7 (301) 230-05-50, Бабушкина, 206 к1, Улан-Удэ.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root{
    --cast:#0f0c0a;--iron:#161210;--line:#3a2e23;--line-soft:#2a2119;
    --ink:#f3ebe0;--dim:#bfae99;--brass:#d9a744;--brass-dim:#9b7a2e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    display:flex;flex-direction:column;
    background:var(--cast);color:var(--ink);
    font-family:'GolosText',system-ui,sans-serif;font-size:17px;line-height:1.6;
  }
  .peg{
    position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px,rgba(217,167,68,.12) 1px,transparent 1.25px);
    background-size:16px 16px;
    mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 72%);
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 72%);
  }
  .wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 clamp(18px,4vw,32px);position:relative}
  header{border-bottom:1px solid var(--line-soft)}
  .top-in{display:flex;align-items:center;gap:12px;min-height:74px}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
  .brand svg{width:26px;height:26px;color:var(--brass);flex:none}
  .brand b{font-family:'Unbounded',system-ui,sans-serif;font-weight:600;font-size:15px}
  main{flex:1;display:flex;align-items:center;padding:clamp(46px,9vw,110px) 0}
  .code{
    font-family:'Unbounded',system-ui,sans-serif;font-weight:700;
    font-size:clamp(64px,13vw,132px);line-height:.9;color:var(--brass);
    letter-spacing:-.04em;
  }
  h1{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:clamp(22px,3.2vw,34px);line-height:1.15;margin:18px 0 0;letter-spacing:-.02em}
  p{margin:18px 0 0;max-width:46ch;color:var(--dim)}
  .cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:32px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;
    background:var(--brass);color:#17120c;text-decoration:none;border-radius:3px;
    font:600 16px/1 'GolosText',system-ui,sans-serif;border:1px solid var(--brass);
  }
  .btn:hover{background:#e9bb60;border-color:#e9bb60}
  .quiet{color:var(--brass);text-decoration:none;border-bottom:1px solid var(--brass-dim);min-height:44px;display:inline-flex;align-items:center}
  .quiet:hover{color:#f0cf8d;border-bottom-color:var(--brass)}
  a:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  footer{border-top:1px solid var(--line);padding:24px 0 32px;font-size:14px;color:#8f8271}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="peg" aria-hidden="true"></div>

<header>
  <div class="wrap top-in">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 26 26" aria-hidden="true" fill="none">
        <rect x="1.2" y="1.2" width="23.6" height="23.6" rx="1.6" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="7.4" cy="7.4" r="1.5" fill="currentColor"/>
        <circle cx="18.6" cy="7.4" r="1.5" fill="currentColor"/>
        <circle cx="13" cy="13" r="1.5" fill="currentColor"/>
        <circle cx="7.4" cy="18.6" r="1.5" fill="currentColor"/>
        <circle cx="18.6" cy="18.6" r="1.5" fill="currentColor"/>
      </svg>
      <b>Garage masters</b>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="code" aria-hidden="true">404</p>
    <h1>Этой страницы нет</h1>
    <p>Адрес набрали с ошибкой или страницу убрали. Сервис работает как обычно: Бабушкина, 206 к1, ежедневно с 09:00 до 19:00.</p>
    <div class="cta">
      <a class="btn" href="tel:+73012300550">Позвонить</a>
      <a class="quiet" href="index.html">На главную</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">Garage masters · Улан-Удэ, улица Бабушкина, 206 к1</div>
</footer>

</body>
</html>
